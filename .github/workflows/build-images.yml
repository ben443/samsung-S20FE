name: Halium 11 images

on:
  pull_request:
  push:
    paths:
      - '*.sh'
      - deviceinfo
      - overlay/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check shell scripts and device configuration
        run: |
          bash -n build.sh package-device.sh build-rootfs.sh deviceinfo tests/build-flow.sh tests/workflow-download.sh
          bash -n overlay/system/usr/libexec/lxc-android-config/mount-halium-overlay
          shellcheck build.sh package-device.sh build-rootfs.sh tests/build-flow.sh tests/workflow-download.sh \
            overlay/system/usr/libexec/lxc-android-config/mount-halium-overlay
          ./build.sh --help
          bash tests/workflow-download.sh
      - name: Test module packaging and rootfs assembly
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot e2fsprogs
          bash tests/build-flow.sh

  images:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Free space for toolchains and images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl e2fsprogs \
            fakeroot flex git kmod libssl-dev libtinfo5 lz4 python2 python3 unzip xz-utils
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
      - name: Download inputs and compute checksums
        env:
          ROOTFS_URL: https://ci.ubports.com/job/ubuntu-touch-rootfs/job/ubports%252Ffocal/389/artifact/ubuntu-touch-hybris-rootfs-arm64.tar.gz
          HALIUM_URL: https://ci.ubports.com/job/UBportsCommunityPortsJenkinsCI/job/ubports%252Fporting%252Fcommunity-ports%252Fjenkins-ci%252Fgeneric_arm64/job/halium-11.0/991/artifact/halium_halium_arm64.tar.xz
          RAMDISK_URL: https://github.com/halium/initramfs-tools-halium/releases/download/dynparts/initrd.img-touch-arm64
        run: |
          set -euo pipefail
          mkdir -p inputs
          for kind in ROOTFS HALIUM RAMDISK; do
            url="${kind}_URL"
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
              "${!url}" -o "inputs/$kind"
            test -s "inputs/$kind"
            hash="$(sha256sum "inputs/$kind" | cut -d' ' -f1)"
            printf '%s_SHA256=%s\n' "$kind" "$hash" >> "$GITHUB_ENV"
          done
      - name: Build kernel, boot image, adaptation and Focal rootfs
        env:
          ROOTFS_ARCHIVE: inputs/ROOTFS
          HALIUM_ARCHIVE: inputs/HALIUM
          RAMDISK_ARCHIVE: inputs/RAMDISK
        run: ./build.sh
      - name: Upload images and adaptation archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: halium-11-r8q-${{ github.sha }}
          path: |
            out/*.img
            out/device_r8q.tar.xz
            out/SHA256SUMS
            out/build-info.txt
          if-no-files-found: error
          retention-days: 14
